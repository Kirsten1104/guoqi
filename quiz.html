<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五星红旗 · 互动问答</title>
<link rel="stylesheet" href="common.css">
</head>
<body data-page="quiz">

<div class="bg-stars" aria-hidden="true">
  <span style="left:5%;top:15%">★</span>
  <span style="left:18%;top:55%;font-size:18px">★</span>
  <span style="left:80%;top:20%;font-size:30px">★</span>
  <span style="left:90%;top:60%;font-size:20px">★</span>
  <span style="left:50%;top:85%;font-size:16px">★</span>
  <span style="left:35%;top:30%;font-size:22px">★</span>
</div>

<header class="site-header">
  <div class="lang-bar">
    <label for="langSelect" data-i18n="lang_label">语言</label>
    <select id="langSelect" class="lang-select" aria-label="Language / 语言">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ru">Русский</option>
      <option value="es">Español</option>
      <option value="ar">العربية</option>
    </select>
  </div>
  <span class="deco-star" style="left:8%;top:18%;font-size:28px">★</span>
  <span class="deco-star" style="left:88%;top:25%;font-size:22px;animation-delay:1s">★</span>
  <span class="deco-star" style="left:78%;top:70%;font-size:18px;animation-delay:2s">★</span>
  <span class="deco-star" style="left:15%;top:75%;font-size:24px;animation-delay:1.5s">★</span>
  <h1 data-i18n="header_title">五 星 红 旗</h1>
  <p class="sub" data-i18n="header_sub_quiz">互 动 问 答</p>
  <nav class="nav">
    <a href="index.html" data-i18n="nav_index">国旗简介</a>
    <a href="quiz.html" class="active" data-i18n="nav_quiz">互动问答</a>
  </nav>
</header>

<div class="flag-wrap">
  <div class="flag" aria-label="五星红旗">
    <div class="big-star">★</div>
    <div class="sm-star s1">★</div>
    <div class="sm-star s2">★</div>
    <div class="sm-star s3">★</div>
    <div class="sm-star s4">★</div>
  </div>
</div>

<main>
  <section id="quiz">
    <div class="section-title">
      <span class="bar"></span>
      <h2 data-i18n="quiz_sec_title">互动问答</h2>
      <span class="star">★</span>
    </div>

    <div class="card">
      <div class="quiz-head">
        <div class="meta">
          <span class="badge" id="badgeBank">题库共 0 题</span>
          <span class="badge gold" id="badgeProgress">已答 0 / 10</span>
          <span class="badge" id="badgeScore">得分 0</span>
        </div>
        <div class="progress"><i id="progressBar"></i></div>
        <button class="btn btn-ghost" id="refreshBtn" data-i18n="btn_refresh">换一组题</button>
      </div>

      <div id="quizArea"></div>

      <div class="quiz-result" id="resultBox">
        <div style="font-size:22px;letter-spacing:3px" data-i18n="result_title">本次答题完成</div>
        <div class="score-big" id="finalScore">0 / 10</div>
        <div class="score-tip" id="resultTip">继续加油,五星红旗永远飘扬!</div>
        <div class="actions">
          <button class="btn btn-ghost" id="againBtn" data-i18n="btn_again">再答一组</button>
          <a class="btn btn-ghost" href="index.html" data-i18n="btn_back">回看简介</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="star-divider">★ ★ ★ ★ ★</div>
  <p data-i18n="footer_text">致敬五星红旗 · 弘扬红色文化</p>
</footer>

<script src="i18n.js"></script>
<script>
/* ============== 问答逻辑(题库随语言切换) ============== */
const QUIZ_SIZE = 10;
let currentQuiz = [];
let userScore = 0;
let answeredCount = 0;

const quizArea     = document.getElementById('quizArea');
const resultBox    = document.getElementById('resultBox');
const badgeBank    = document.getElementById('badgeBank');
const badgeProgress= document.getElementById('badgeProgress');
const badgeScore   = document.getElementById('badgeScore');
const progressBar  = document.getElementById('progressBar');
const finalScore   = document.getElementById('finalScore');
const resultTip    = document.getElementById('resultTip');

/* 当前语言的题库 */
function bank(){ return I18N[currentLang].questions; }

/* 刷新统计徽章 */
function refreshBadges(){
  badgeBank.textContent     = fmt('badge_bank',     {n: bank().length});
  badgeProgress.textContent = fmt('badge_progress', {a: answeredCount, t: QUIZ_SIZE});
  badgeScore.textContent    = fmt('badge_score',    {s: userScore});
}

/* 从题库随机抽取 N 题 */
function pickQuestions(n){
  const arr = [...bank()];
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr.slice(0,n).map(q => ({...q, shuffled: shuffleOptions(q)}));
}

/* 打乱选项顺序,并记录正确答案新位置 */
function shuffleOptions(q){
  const idx = q.o.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [idx[i],idx[j]] = [idx[j],idx[i]];
  }
  return {
    options: idx.map(i => q.o[i]),
    correctIndex: idx.indexOf(q.a)
  };
}

/* 渲染一组题 */
function renderQuiz(){
  currentQuiz = pickQuestions(QUIZ_SIZE);
  userScore = 0;
  answeredCount = 0;
  resultBox.classList.remove('show');
  quizArea.innerHTML = '';

  currentQuiz.forEach((item, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.innerHTML = `
      <div class="q-title">
        <span class="num">${qi+1}</span>
        <span>${item.q}</span>
      </div>
      <div class="options" data-qi="${qi}">
        ${item.shuffled.options.map((opt,oi)=>`
          <div class="option" data-oi="${oi}">
            <span class="tag">${String.fromCharCode(65+oi)}</span>
            <span>${opt}</span>
          </div>
        `).join('')}
      </div>
    `;
    quizArea.appendChild(card);
  });

  bindOptions();
  refreshBadges();
  progressBar.style.width = '0%';
}

/* 绑定选项点击 */
function bindOptions(){
  document.querySelectorAll('.options').forEach(group => {
    const qi = +group.dataset.qi;
    group.querySelectorAll('.option').forEach(opt => {
      opt.addEventListener('click', () => {
        if(group.classList.contains('locked')) return;
        group.classList.add('locked');
        const oi = +opt.dataset.oi;
        const correct = currentQuiz[qi].shuffled.correctIndex;
        group.querySelectorAll('.option').forEach((o,i) => {
          o.classList.add('disabled');
          if(i === correct) o.classList.add('correct');
          else if(i === oi) o.classList.add('wrong');
        });
        if(oi === correct){
          userScore++;
        }
        answeredCount++;
        refreshBadges();
        progressBar.style.width = (answeredCount / QUIZ_SIZE * 100) + '%';
        if(answeredCount === QUIZ_SIZE) showResult();
      });
    });
  });
}

function showResult(){
  finalScore.textContent = `${userScore} / ${QUIZ_SIZE}`;
  let tipKey;
  if(userScore === QUIZ_SIZE)      tipKey = 'tip_full';
  else if(userScore >= 8)          tipKey = 'tip_great';
  else if(userScore >= 6)          tipKey = 'tip_good';
  else if(userScore >= 4)          tipKey = 'tip_ok';
  else                             tipKey = 'tip_low';
  resultTip.textContent = t(tipKey);
  resultBox.classList.add('show');
  resultBox.scrollIntoView({behavior:'smooth',block:'center'});
}

document.getElementById('refreshBtn').addEventListener('click', () => {
  renderQuiz();
  document.getElementById('quiz').scrollIntoView({behavior:'smooth'});
});
document.getElementById('againBtn').addEventListener('click', () => {
  renderQuiz();
  document.getElementById('quiz').scrollIntoView({behavior:'smooth'});
});

/* 切换语言后,以新语言的题库重新出题 */
window.onI18nApplied = function(){
  renderQuiz();
};

/* 初始化 */
renderQuiz();
</script>

</body>
</html>
